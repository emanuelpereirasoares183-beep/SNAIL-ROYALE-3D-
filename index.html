<style>
:root{--bg:#cfe9d2;--fg:#16341c;--panel:rgba(255,255,255,.88);--bar:#3a1d52;--fill:#d95af2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2417;--fg:#e8f5e9;--panel:rgba(20,40,28,.9)}}
:root[data-theme="dark"]{--bg:#0f2417;--fg:#e8f5e9;--panel:rgba(20,40,28,.9)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%}
#top{position:absolute;top:6px;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 4px #000a;color:#fff}
#tm{font-size:34px;font-weight:800}#cr{font-size:15px;font-weight:600}
#msg{position:absolute;left:0;right:0;bottom:185px;text-align:center;font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 4px #000;pointer-events:none;opacity:0;transition:opacity .3s}
#bot{position:absolute;left:0;right:0;bottom:0;padding:8px 8px 10px;background:var(--panel)}
#eb{position:relative;height:22px;border-radius:11px;background:var(--bar);overflow:hidden;margin-bottom:8px}
#ef{height:100%;width:50%;background:var(--fill);transition:width .1s}
#et{position:absolute;inset:0;text-align:center;font-size:13px;line-height:22px;color:#fff;font-weight:700}
#cs{display:flex;gap:4px}
.cd{flex:1;min-width:0;border:2px solid transparent;border-radius:10px;color:#fff;padding:4px 1px;height:100px;overflow:visible;font:inherit;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-shadow:0 1px 3px #000}
.cd b{font-size:10px;line-height:1.1;max-width:100%;overflow-wrap:anywhere;text-align:center}.cd small{font-size:9px;margin-top:3px;line-height:1.2;text-align:center}
.cd i{position:absolute;top:-8px;left:-4px;width:22px;height:22px;border-radius:50%;background:#8e3fc4;font-style:normal;font-weight:800;line-height:18px;font-size:12px;border:2px solid #fff}
.cd.sel{border-color:#ffe53b;transform:translateY(-8px)}
.cd.no{filter:brightness(.5)}
.cd.sh{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#ov{position:absolute;top:84px;left:0;right:0;background:none;pointer-events:none;display:none;flex-direction:column;align-items:center;color:#fff;text-align:center;gap:8px;text-shadow:0 2px 6px #000}
#ov h1{font-size:48px;margin:0}#ov p{font-size:18px;white-space:pre-line;margin:0;font-weight:600}
#ov button{pointer-events:auto;font:inherit;font-size:18px;font-weight:700;padding:12px 26px;border:0;border-radius:14px;background:#2fb04a;color:#fff;margin-top:4px;text-shadow:none}
#ar{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5}
#ah{text-align:center;padding:14px 8px 6px}#at{font-size:26px;font-weight:800}
#al{flex:1;min-height:0;overflow-y:auto;padding:8px 14px}
#ro{flex:0 0 40%;overflow-y:auto;padding:4px 14px 8px;border-top:2px solid #0003}
.rt{font-weight:800;padding:6px 0}.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{display:flex;gap:8px;align-items:center;border:3px solid transparent;border-radius:12px;padding:8px;background:var(--panel)}
.rc.lk{opacity:.5}.rt button{font:inherit;border:0;border-radius:8px;padding:2px 14px;background:var(--panel);color:var(--fg);font-weight:800}.rt{text-align:center}
.rc u{width:34px;height:34px;border-radius:50%;flex:none;border:3px solid #0004}
.rc div{display:flex;flex-direction:column}.rc b{font-size:14px}.rc small{font-size:11px;opacity:.85}
.ai{border-radius:16px;padding:16px;margin-bottom:10px;color:#fff;text-shadow:0 2px 4px #000c;display:flex;flex-direction:column;gap:2px;border:4px solid transparent}
.ai b{font-size:22px}.ai span{font-size:17px}.ai small{font-size:13px}
.ai.lk{filter:grayscale(.7) brightness(.6)}.ai.cur{border-color:#ffe53b}
#bb{display:flex;gap:8px;margin:8px 14px 12px}
#ab,#on{flex:1;font:inherit;font-size:18px;font-weight:800;padding:14px 6px;border:0;border-radius:16px;background:#2fb04a;color:#fff}
#on{background:#3a7be0}
#op{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:6;padding:20px;text-align:center}
#op h2{margin:0;font-size:28px}#op p{margin:0;font-size:16px;font-weight:600;min-height:44px}
#op button{font:inherit;font-size:18px;font-weight:800;padding:12px 24px;border:0;border-radius:14px;background:#3a7be0;color:#fff}
#op #obk{background:#777}
#oc{font-size:56px;font-weight:900;letter-spacing:10px;min-height:64px}.ou{opacity:.6;font-weight:700}
.or{display:flex;gap:8px}
